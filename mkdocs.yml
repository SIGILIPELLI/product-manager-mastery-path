site_name: Product Manager Mastery Path
site_description: A structured, module-wise product management training program from entry level to master level, with real frameworks and templates in every module.
site_url: https://sigilipelli.github.io/product-manager-mastery-path/
repo_url: https://github.com/SIGILIPELLI/product-manager-mastery-path
repo_name: product-manager-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is Product Management?": level-1/01-what-is-product-management.md
      - "02 · Understanding Customers & Users": level-1/02-understanding-customers-users.md
      - "03 · Problem Discovery": level-1/03-problem-discovery.md
      - "04 · Prioritization Basics": level-1/04-prioritization-basics.md
      - "05 · Writing Requirements": level-1/05-writing-requirements.md
      - "06 · Working with Design & Engineering": level-1/06-working-with-design-engineering.md
      - "07 · Metrics & KPIs Basics": level-1/07-metrics-kpis-basics.md
      - "08 · Roadmapping Basics": level-1/08-roadmapping-basics.md
      - "09 · Stakeholder Communication Basics": level-1/09-stakeholder-communication-basics.md
      - "10 · Project — Write a Complete PRD": level-1/10-project-complete-prd.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Advanced Discovery": level-2/01-advanced-discovery.md
      - "02 · Prioritization Frameworks Deep Dive": level-2/02-prioritization-frameworks-deep-dive.md
      - "03 · A/B Testing & Experimentation Basics": level-2/03-ab-testing-experimentation-basics.md
      - "04 · Product Analytics": level-2/04-product-analytics.md
      - "05 · Go-to-Market Basics": level-2/05-go-to-market-basics.md
      - "06 · Working with Data Teams": level-2/06-working-with-data-teams.md
      - "07 · Agile/Scrum for PMs": level-2/07-agile-scrum-for-pms.md
      - "08 · Competitive Analysis": level-2/08-competitive-analysis.md
      - "09 · Pricing Basics": level-2/09-pricing-basics.md
      - "10 · Project — GTM Plan for a Feature Launch": level-2/10-project-gtm-plan.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-3/*.md
  level-4/*.md
